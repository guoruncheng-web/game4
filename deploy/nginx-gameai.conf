# 游戏盒子 www.gameai.xingzdh.com
# Next.js 跑在 127.0.0.1:7010,由 systemd 单元 gameai.service 管理。
# 选 7010 是因为 3000 被 docker 的 nextjs-web 占了、7006 是 gamebox。

server {
    if ($host = www.gameai.xingzdh.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.gameai.xingzdh.com;
    # certbot 的 HTTP-01 挑战要走明文,所以这段不能整体 301
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # 联机 WebSocket。独立进程(gameai-ws.service),不走 Next。
    # proxy_read_timeout 给到 1 小时:长连接本来就该一直开着,
    # 默认的 60 秒会让空闲玩家莫名其妙掉线
    location / { return 301 https://$host$request_uri; }


}

server {
    listen 443 ssl http2;
    server_name www.gameai.xingzdh.com;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/gameai-access.log;
    error_log  /var/log/nginx/gameai-error.log;

    # 游戏素材单个就有几 MB,上传接口也可能带图
    client_max_body_size 20M;

    # Next 的静态产物带内容哈希,可以长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:7010;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ws {
        proxy_pass http://127.0.0.1:7011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:7010;
        proxy_http_version 1.1;
        # 这三行是 WebSocket 升级的关键。联机功能要用,少一行连不上
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接不能被读超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    ssl_certificate /etc/letsencrypt/live/www.gameai.xingzdh.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.gameai.xingzdh.com/privkey.pem; # managed by Certbot
}
