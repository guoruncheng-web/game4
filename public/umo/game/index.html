<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | umo-h5</title>

  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5efe3">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">
  <link rel="icon"
        type="image/png"
        href="assets/resources/native/65/65e1cbb8-46a0-4ecf-b13c-e602b75fa5e4.png">

  <!-- MainMenu's background is the largest first-scene image. Discover it with
       the initial HTML so it downloads in parallel with the Cocos engine. -->
  <link rel="preload"
        href="assets/resources/native/5c/5c4b8447-b458-4a0f-90bf-2b350b78d349.png"
        as="image"
        type="image/png"
        crossorigin="anonymous"
        fetchpriority="high">
  <link rel="stylesheet" type="text/css" href="style.css"/>
  <style>
    html, body { background: #f5efe3; }
  </style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>

  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <script>
    System.import('./index.js').catch(function (error) { console.error(error); });
  </script>
</body>
</html>
