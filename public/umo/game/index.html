<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | umo-h5</title>

  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#040816">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">

  <!-- MainMenu's background is the largest startup image. Discover it with the
       initial HTML so it downloads in parallel with the Cocos engine. -->
  <link rel="preload"
        href="assets/resources/native/b3/b3b8bb3e-fe07-4bf3-8de5-701ff416e355.png"
        as="image"
        type="image/png"
        crossorigin="anonymous"
        fetchpriority="high">
  <link rel="preload"
        href="assets/resources/native/b1/b1954d77-54e9-4cc4-851b-381dc9560c02.png"
        as="image"
        type="image/png"
        fetchpriority="high">
  <link rel="stylesheet" type="text/css" href="style.css"/>
  <style>
    html, body { background: #040816; }
    #umo-startup {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #040816 url("assets/resources/native/b1/b1954d77-54e9-4cc4-851b-381dc9560c02.png") center / cover no-repeat;
      color: #f1ddb1;
      font: 900 clamp(18px, 4.5vw, 28px)/1.2 Arial, sans-serif;
      letter-spacing: .08em;
    }
    #umo-startup::before {
      content: "UMO";
      position: absolute;
      top: max(17%, env(safe-area-inset-top));
      font-size: clamp(52px, 18vw, 108px);
      letter-spacing: -.06em;
      color: #41d6b2;
      text-shadow: 0 5px 0 #10172a, 0 0 28px rgb(65 214 178 / 35%);
    }
    #umo-startup span {
      position: absolute;
      bottom: max(12%, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <div id="umo-startup" role="status" aria-label="正在启动 UMO"><span>正在启动牌桌…</span></div>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>

  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <script>
    System.import('./index.js').catch(function (error) { console.error(error); });
  </script>
</body>
</html>
