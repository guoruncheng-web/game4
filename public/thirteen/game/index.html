  <script>
    (function () {
      var NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!NativeAudioContext) return;
      var contexts = [];
      function TrackedAudioContext() {
        var context = new NativeAudioContext();
        contexts.push(context);
        return context;
      }
      TrackedAudioContext.prototype = NativeAudioContext.prototype;
      Object.setPrototypeOf(TrackedAudioContext, NativeAudioContext);
      if (window.AudioContext) window.AudioContext = TrackedAudioContext;
      else window.webkitAudioContext = TrackedAudioContext;
      window.__thirteenResumeAudio = function () {
        contexts.forEach(function (context) {
          if (context.state !== 'running' && context.resume) context.resume().catch(function () {});
        });
      };
      window.__thirteenAudioContextState = function () {
        if (!contexts.length) return 'unavailable';
        return contexts.map(function (context) { return context.state; }).join(',');
      };
    }());
  </script>
