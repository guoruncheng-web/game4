name: voice-release-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production diagnostics
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.86.46.212 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=10 deploy@47.86.46.212 'date -u; uptime; df -Pk /srv/gameai; free -m; ps -eo pid,ppid,etime,pcpu,pmem,comm --sort=-pcpu | head -20; cat /srv/gameai/.backend/frontend.current; ls -l /srv/gameai/.releases/821bf7db4cf264f0d63175724b255f5fa0bbd430/.next/BUILD_ID /srv/gameai/.releases/821bf7db4cf264f0d63175724b255f5fa0bbd430/.next/build-manifest.json 2>/dev/null || true'
