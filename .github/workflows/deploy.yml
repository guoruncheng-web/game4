name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production topology without secrets
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.86.46.212 >> ~/.ssh/known_hosts 2>/dev/null
          ssh deploy@47.86.46.212 bash -se <<'REMOTE'
          id
          sudo -n -l
          systemctl show gameai gameai-ws -p FragmentPath -p ExecStart -p WorkingDirectory -p Environment
          df -h /srv/gameai
          du -sh /srv/gameai/node_modules /srv/gameai/.next /srv/gameai/.state
          command -v node pnpm npm
          /opt/node24/bin/node --version
          ss -ltn
          REMOTE
