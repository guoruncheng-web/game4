name: voice-release-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production diagnostics
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.86.46.212 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=10 deploy@47.86.46.212 'ps -eo pid,ppid,etime,args | grep -E "nest-release.sh|next build|next/dist/build|pnpm build" | grep -v grep; cat /srv/gameai/.backend/frontend.current'
