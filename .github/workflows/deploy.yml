name: rtc-patch-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect retained failed RTC build without mutations
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 47.86.46.212 >> ~/.ssh/known_hosts 2>/dev/null
          ssh deploy@47.86.46.212 /opt/node24/bin/node --input-type=module < deploy/inspect-rtc-build.mjs
